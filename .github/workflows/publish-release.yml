name: publish-release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的版本"
        required: true
        type: string
      run_id:
        description: "包含 chromium 构建产物的 build-x64 运行编号"
        required: true
        type: string
  workflow_call:
    inputs:
      target_tag:
        required: true
        type: string
      x64_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ inputs.target_tag || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download x64 package
        uses: actions/download-artifact@v8
        with:
          name: chromium
          path: artifacts/x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.x64_run_id || inputs.run_id }}

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.target_tag || inputs.tag_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/x64/ungoogled-chromium*
